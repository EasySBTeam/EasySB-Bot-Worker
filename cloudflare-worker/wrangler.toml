name = "easysb-bot"
main = "src/index.js"
compatibility_date = "2026-06-29"
workers_dev = false
preview_urls = false

[observability]
enabled = true

[placement]
hostname = "api.github.com"

[triggers]
# Daily stale-PR scan (see src/stale.js). The handler does nothing unless a
# repository opts in with "enable_stale_bot": true in .github/formalities.json.
crons = ["30 5 * * *"]

[vars]
DEPLOY_HASH = "unknown"
DEPLOY_DATE = "unknown"

# Cloudflare Workers cap outgoing fetch() calls per invocation. The handler
# keeps SUBREQUEST_RESERVE_HEADROOM off the top of SUBREQUEST_BUDGET_LIMIT for
# the writes that must always go out (labels, PR comment, check-runs), so a
# huge pull request can never starve the report. Raise the limit after
# upgrading to Workers Paid.
SUBREQUEST_BUDGET_LIMIT = "45"
SUBREQUEST_RESERVE_HEADROOM = "15"
