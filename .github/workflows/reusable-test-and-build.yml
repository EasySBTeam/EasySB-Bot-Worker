name: Test and build

# Shared by the pull request gate and the deploy workflow so both run the exact
# same check before anything reaches Cloudflare.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-slim
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Run unit tests
        run: npm test
        working-directory: cloudflare-worker
        env:
          FORCE_COLOR: 1

      - name: Dry run wrangler deploy
        run: npx wrangler deploy --dry-run
        working-directory: cloudflare-worker
